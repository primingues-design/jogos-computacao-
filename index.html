<script>

// ══════════════════════════════════
// CONFIGURAÇÃO
// ══════════════════════════════════
const TOTAL_RODADAS = 3;

// Desafios com passos embaralhados em cada rodada
const DESAFIOS = [
  {
    titulo:'Mensagem Simples',
    passos:[
      { id:0, icon:'📲', texto:'Abrir o WhatsApp', ordemCorreta:0 },
      { id:1, icon:'👤', texto:'Escolher o contato', ordemCorreta:1 },
      { id:2, icon:'⌨️', texto:'Escrever a mensagem', ordemCorreta:2 },
      { id:3, icon:'📤', texto:'Clicar em Enviar', ordemCorreta:3 },
    ]
  },
  {
    titulo:'Mensagem com Foto',
    passos:[
      { id:0, icon:'📲', texto:'Abrir o WhatsApp', ordemCorreta:0 },
      { id:1, icon:'👤', texto:'Selecionar o contato', ordemCorreta:1 },
      { id:2, icon:'📎', texto:'Tocar no ícone de anexar', ordemCorreta:2 },
      { id:3, icon:'🖼️', texto:'Escolher a foto da galeria', ordemCorreta:3 },
      { id:4, icon:'✍️', texto:'Escrever uma legenda (opcional)', ordemCorreta:4 },
      { id:5, icon:'📤', texto:'Tocar em Enviar', ordemCorreta:5 },
    ]
  },
  {
    titulo:'Criar Grupo',
    passos:[
      { id:0, icon:'📲', texto:'Abrir o WhatsApp', ordemCorreta:0 },
      { id:1, icon:'⋮', texto:'Tocar nos três pontos (menu)', ordemCorreta:1 },
      { id:2, icon:'👥', texto:'Selecionar &quot;Novo Grupo&quot;', ordemCorreta:2 },
      { id:3, icon:'➕', texto:'Adicionar os participantes', ordemCorreta:3 },
      { id:4, icon:'✍️', texto:'Digitar o nome do grupo', ordemCorreta:4 },
      { id:5, icon:'✅', texto:'Tocar em &quot;Criar&quot;', ordemCorreta:5 },
    ]
  },
];

// Modo fácil: 4 passos; Difícil: até 6 passos + cronômetro
let modo = 'facil';
let rodada = 0;
let pontos = 0;
let slotContents = [];
let draggedId = null;
let dragSource = null;
let cronTimer = null;
let cronSegundos = 0;
let cronAtivo = false;
let totalSegundosGasto = 0;

// ══════════════════════════════════
// MODO
// ══════════════════════════════════
function definirModo(m) {
  modo = m;
  document.getElementById('btnFacil').classList.toggle('ativo', m==='facil');
  document.getElementById('btnDificil').classList.toggle('ativo', m==='dificil');

  const instrucao = document.getElementById('instrucaoDiv');
  if (m === 'dificil') {
    instrucao.innerHTML = `<span>🔥 Modo Difícil:</span> Mais passos + cronômetro correndo! Organize tudo na <span>ordem correta</span> o mais rápido possível!`;
  } else {
    instrucao.innerHTML = `<span>👆 Arraste</span> os passos para a coluna da direita na <span>ordem correta</span> para enviar uma mensagem!`;
  }

  iniciarJogo();
}

// ══════════════════════════════════
// JOGO
// ══════════════════════════════════
function iniciarJogo() {
  rodada = 0;
  pontos = 0;
  totalSegundosGasto = 0;
  document.getElementById('pontosNum').textContent = '0';
  document.getElementById('telaFinal').style.display = 'none';
  document.getElementById('jogoDiv').style.display = 'block';
  pararCron();
  carregarRodada();
}

function carregarRodada() {
  const desafio = getDesafio();
  const passos = filtrarPassos(desafio.passos);

  slotContents = new Array(passos.length).fill(null);
  document.getElementById('resultadoMsg').className = 'resultado-msg';
  document.getElementById('rodadaBadge').textContent = `Rodada ${rodada+1} / ${TOTAL_RODADAS}`;
  atualizarProgresso(0, passos.length);

  renderizarZonas(passos);

  if (modo === 'dificil') {
    iniciarCron();
  } else {
    pararCron();
    document.getElementById('cronNum').textContent = '--';
  }
}

function getDesafio() {
  return DESAFIOS[rodada % DESAFIOS.length];
}

function filtrarPassos(passos) {
  if (modo === 'facil') return passos.slice(0, 4);
  return passos;
}

function embaralhar(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ══════════════════════════════════
// RENDERIZAR
// ══════════════════════════════════
function renderizarZonas(passos) {
  const embaralhados = embaralhar([...passos]);
  const zonaOrigem = document.getElementById('zonaOrigem');
  zonaOrigem.innerHTML = '';

  embaralhados.forEach(p => {
    zonaOrigem.appendChild(criarCard(p));
  });

  const zonaResposta = document.getElementById('zonaResposta');
  zonaResposta.innerHTML = '';
  passos.forEach((_, i) => {
    zonaResposta.appendChild(criarSlot(i, passos.length));
  });
}

function criarCard(passo) {
  const div = document.createElement('div');
  div.className = 'passo-card';
  div.id = 'card-' + passo.id;
  div.draggable = true;
  div.innerHTML = `
    <span class=&quot;passo-icon&quot;>${passo.icon}</span>
    <span class=&quot;passo-texto&quot;>${passo.texto}</span>
    <span class=&quot;passo-handle&quot;>⠿</span>
  `;

  // Drag events
  div.addEventListener('dragstart', e => {
    draggedId = passo.id;
    dragSource = 'origem';
    setTimeout(() => div.classList.add('dragging'), 0);
  });
  div.addEventListener('dragend', () => div.classList.remove('dragging'));

  // Touch events
  div.addEventListener('touchstart', touchStart, {passive:true});
  div.addEventListener('touchmove', touchMove, {passive:false});
  div.addEventListener('touchend', touchEnd);

  return div;
}

function criarSlot(pos, total) {
  const div = document.createElement('div');
  div.className = 'slot-resposta';
  div.id = 'slot-' + pos;
  div.innerHTML = `
    <span class=&quot;slot-num&quot;>${pos+1}.</span>
    <span class=&quot;slot-placeholder&quot;>Solte aqui o ${pos+1}º passo...</span>
  `;
  div.ondragover = e => { e.preventDefault(); div.classList.add('drag-over'); };
  div.ondragleave = () => div.classList.remove('drag-over');
  div.ondrop = e => dropSlot(e, pos);
  return div;
}

function preencherSlot(pos, passoId) {
  const desafio = getDesafio();
  const passos = filtrarPassos(desafio.passos);
  const passo = passos.find(p => p.id === passoId);
  if (!passo) return;

  const slot = document.getElementById('slot-' + pos);
  slot.className = 'slot-resposta preenchido';
  slot.innerHTML = `
    <span class=&quot;slot-num&quot;>${pos+1}.</span>
    <span class=&quot;passo-icon&quot;>${passo.icon}</span>
    <span class=&quot;passo-texto&quot; style=&quot;font-weight:700;font-size:.9rem&quot;>${passo.texto}</span>
  `;
  slot.draggable = true;
  slot.ondragstart = e => { draggedId = passoId; dragSource = 'slot-' + pos; };
  slot.ondragover = e => { e.preventDefault(); slot.classList.add('drag-over'); };
  slot.ondragleave = () => slot.classList.remove('drag-over');
  slot.ondrop = e => dropSlot(e, pos);

  slotContents[pos] = passoId;
  atualizarProgresso(slotContents.filter(s=>s!==null).length, passos.length);
}

function limparSlot(pos, total) {
  const slot = document.getElementById('slot-' + pos);
  slot.className = 'slot-resposta';
  slot.draggable = false;
  slot.innerHTML = `
    <span class=&quot;slot-num&quot;>${pos+1}.</span>
    <span class=&quot;slot-placeholder&quot;>Solte aqui o ${pos+1}º passo...</span>
  `;
  slot.ondragstart = null;
  slot.ondragover = e => { e.preventDefault(); slot.classList.add('drag-over'); };
  slot.ondragleave = () => slot.classList.remove('drag-over');
  slot.ondrop = e => dropSlot(e, pos);
  slotContents[pos] = null;

  const desafio = getDesafio();
  const passos = filtrarPassos(desafio.passos);
  atualizarProgresso(slotContents.filter(s=>s!==null).length, passos.length);
}

// ══════════════════════════════════
// DRAG &amp; DROP
// ══════════════════════════════════
function ev(e, isSlot=false) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-ativo');
}

function dlv(e) { e.currentTarget.classList.remove('drag-ativo','drag-over'); }

function dropZona(e, zona) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-ativo');
  if (!draggedId &amp;&amp; draggedId !== 0) return;

  if (zona === 'origem') {
    // Devolver para origem
    if (dragSource &amp;&amp; dragSource.startsWith('slot-')) {
      const pos = parseInt(dragSource.split('-')[1]);
      const desafio = getDesafio();
      const passos = filtrarPassos(desafio.passos);
      limparSlot(pos, passos.length);
      if (!document.getElementById('card-' + draggedId)) {
        const passo = passos.find(p => p.id === draggedId);
        if (passo) document.getElementById('zonaOrigem').appendChild(criarCard(passo));
      }
    }
    draggedId = null; dragSource = null;
  }
}

function dropSlot(e, pos) {
  e.preventDefault(); e.stopPropagation();
  const slot = document.getElementById('slot-' + pos);
  slot.classList.remove('drag-over');
  if (!draggedId &amp;&amp; draggedId !== 0) return;

  const desafio = getDesafio();
  const passos = filtrarPassos(desafio.passos);
  const anteriorNeste = slotContents[pos];

  if (dragSource &amp;&amp; dragSource.startsWith('slot-')) {
    const sourcePos = parseInt(dragSource.split('-')[1]);
    if (anteriorNeste !== null) {
      preencherSlot(sourcePos, anteriorNeste);
    } else {
      limparSlot(sourcePos, passos.length);
    }
  } else {
    // Vem da origem
    const el = document.getElementById('card-' + draggedId);
    if (el) el.remove();
    if (anteriorNeste !== null) {
      const p = passos.find(pp => pp.id === anteriorNeste);
      if (p) document.getElementById('zonaOrigem').appendChild(criarCard(p));
    }
  }

  preencherSlot(pos, draggedId);
  draggedId = null; dragSource = null;
}

// ══════════════════════════════════
// TOUCH DRAG (mobile)
// ══════════════════════════════════
let touchData = { el:null, clone:null, offsetX:0, offsetY:0, origParent:null };

function touchStart(e) {
  const card = e.currentTarget;
  const t = e.touches[0];
  const rect = card.getBoundingClientRect();

  touchData.el = card;
  touchData.offsetX = t.clientX - rect.left;
  touchData.offsetY = t.clientY - rect.top;

  // Clone flutuante
  const clone = card.cloneNode(true);
  clone.style.cssText = `
    position:fixed; z-index:9999; opacity:.85; pointer-events:none;
    width:${rect.width}px; left:${t.clientX - touchData.offsetX}px;
    top:${t.clientY - touchData.offsetY}px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    transition:none;
  `;
  document.body.appendChild(clone);
  touchData.clone = clone;
  card.style.opacity = '.3';

  // Descobrir o id
  const id = parseInt(card.id.replace('card-',''));
  if (!isNaN(id)) {
    draggedId = id;
    dragSource = 'origem';
  } else {
    // Vem de um slot
    const slotEl = card.closest('.slot-resposta');
    if (slotEl) {
      const pos = parseInt(slotEl.id.replace('slot-',''));
      draggedId = slotContents[pos];
      dragSource = 'slot-' + pos;
    }
  }
}

function touchMove(e) {
  e.preventDefault();
  if (!touchData.clone) return;
  const t = e.touches[0];
  touchData.clone.style.left = (t.clientX - touchData.offsetX) + 'px';
  touchData.clone.style.top = (t.clientY - touchData.offsetY) + 'px';
}

function touchEnd(e) {
  if (!touchData.clone) return;
  touchData.clone.remove();
  touchData.clone = null;
  if (touchData.el) touchData.el.style.opacity = '';

  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);

  // Encontrar slot alvo
  const slot = el ? el.closest('.slot-resposta') : null;
  if (slot) {
    const pos = parseInt(slot.id.replace('slot-',''));
    if (!isNaN(pos)) {
      const fakeEv = { preventDefault:()=>{}, stopPropagation:()=>{}, currentTarget:slot };
      dropSlot(fakeEv, pos);
    }
  } else {
    const zona = el ? el.closest('.zona-bagunca') : null;
    if (zona &amp;&amp; dragSource &amp;&amp; dragSource.startsWith('slot-')) {
      const pos = parseInt(dragSource.split('-')[1]);
      const desafio = getDesafio();
      const passos = filtrarPassos(desafio.passos);
      const pid = slotContents[pos];
      limparSlot(pos, passos.length);
      if (pid !== null) {
        const p = passos.find(pp => pp.id === pid);
        if (p) document.getElementById('zonaOrigem').appendChild(criarCard(p));
      }
    }
  }

  draggedId = null; dragSource = null; touchData.el = null;
}

// ══════════════════════════════════
// VERIFICAR
// ══════════════════════════════════
function verificar() {
  const desafio = getDesafio();
  const passos = filtrarPassos(desafio.passos);

  if (slotContents.some(s => s === null)) {
    mostrarFeedbackFloat('⚠️ Coloque todos os passos primeiro!', '#F39C12');
    return;
  }

  let acertos = 0;
  slotContents.forEach((id, pos) => {
    const slot = document.getElementById('slot-' + pos);
    const passo = passos.find(p => p.id === id);
    if (passo &amp;&amp; passo.ordemCorreta === pos) {
      acertos++;
      slot.classList.remove('errado');
      slot.classList.add('correto');
    } else {
      slot.classList.remove('correto');
      slot.classList.add('errado');
    }
  });

  if (acertos === passos.length) {
    // Calcular pontos: base + bônus de tempo
    let ganhou = 30;
    if (modo === 'dificil') {
      const bonus = Math.max(0, 60 - cronSegundos) * 2;
      ganhou = 30 + bonus;
      totalSegundosGasto += cronSegundos;
      pararCron();
    }

    pontos += ganhou;
    document.getElementById('pontosNum').textContent = pontos;
    document.getElementById('pontosNum').classList.add('bump');
    setTimeout(() => document.getElementById('pontosNum').classList.remove('bump'), 400);

    tocarSom(true);
    mostrarFeedbackFloat('🎉 Perfeito!', '#25D366');
    lancarConfete();

    const msgDiv = document.getElementById('resultadoMsg');
    msgDiv.className = 'resultado-msg acerto';
    msgDiv.innerHTML = `✅ <strong>Perfeito! ${ganhou} pontos!</strong>${modo==='dificil' ? ` (bônus de tempo incluído)` : ''}<br>
      ${rodada < TOTAL_RODADAS-1 ? `<button onclick=&quot;avancarRodada()&quot; style=&quot;margin-top:10px;padding:8px 22px;background:var(--wa);border:none;border-radius:20px;color:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;&quot;>Próximo Desafio →</button>` : `<button onclick=&quot;mostrarFinal()&quot; style=&quot;margin-top:10px;padding:8px 22px;background:var(--wa);border:none;border-radius:20px;color:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;&quot;>🏆 Ver Resultado</button>`}
    `;
  } else {
    tocarSom(false);
    mostrarFeedbackFloat(`🤔 ${acertos} de ${passos.length} corretos`, '#E74C3C');
    const msgDiv = document.getElementById('resultadoMsg');
    msgDiv.className = 'resultado-msg parcial';
    msgDiv.innerHTML = `⚠️ <strong>${acertos} de ${passos.length} passos corretos.</strong> Os itens em vermelho estão na posição errada. Tente de novo!`;
  }
}

function avancarRodada() {
  rodada++;
  document.getElementById('resultadoMsg').className = 'resultado-msg';
  carregarRodada();
}

function reiniciarRodada() {
  document.getElementById('resultadoMsg').className = 'resultado-msg';
  pararCron();
  carregarRodada();
}

// ══════════════════════════════════
// FINAL
// ══════════════════════════════════
function mostrarFinal() {
  pararCron();
  document.getElementById('jogoDiv').style.display = 'none';
  const final = document.getElementById('telaFinal');
  final.style.display = 'block';

  document.getElementById('ptsFinal').textContent = pontos;
  const max = TOTAL_RODADAS * (modo === 'dificil' ? 150 : 30);
  const pct = pontos / max;

  let emoji = '🥉', titulo = 'Continue praticando!', sub = 'Você completou os desafios!';
  if (pct === 1) { emoji='🏆'; titulo='Perfeito!'; sub='Pontuação máxima! Você domina o WhatsApp!'; }
  else if (pct >= .7) { emoji='🥇'; titulo='Muito bem!'; sub='Você sabe enviar mensagens de forma eficiente!'; }
  else if (pct >= .4) { emoji='🥈'; titulo='Bom trabalho!'; sub='Com mais prática você vai arrasar!'; }

  document.getElementById('emojiFinal').textContent = emoji;
  document.getElementById('h2Final').textContent = titulo;
  document.getElementById('subFinal').textContent = sub;

  if (modo === 'dificil' &amp;&amp; totalSegundosGasto > 0) {
    document.getElementById('tempoFinal').textContent = `⏱ Tempo total: ${totalSegundosGasto}s`;
  } else {
    document.getElementById('tempoFinal').textContent = '';
  }

  tocarSom(true);
}

// ══════════════════════════════════
// CRONÔMETRO
// ══════════════════════════════════
function iniciarCron() {
  pararCron();
  cronSegundos = 0;
  cronAtivo = true;
  const el = document.getElementById('cronNum');
  el.className = 'cron-num';
  el.textContent = '0';

  cronTimer = setInterval(() => {
    cronSegundos++;
    el.textContent = cronSegundos;
    if (cronSegundos >= 45) {
      el.className = 'cron-num urgente';
    }
  }, 1000);
}

function pararCron() {
  if (cronTimer) { clearInterval(cronTimer); cronTimer = null; }
  cronAtivo = false;
}

// ══════════════════════════════════
// PROGRESSO
// ══════════════════════════════════
function atualizarProgresso(qtd, total) {
  const pct = total ? (qtd/total)*100 : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${qtd} de ${total}`;
}

// ══════════════════════════════════
// SOM &amp; CONFETE
// ══════════════════════════════════
function tocarSom(ok) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ok) {
      [523,659,784,1047].forEach((f,i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f; o.type = 'sine';
        const t = ctx.currentTime + i*.12;
        g.gain.setValueAtTime(.28, t);
        g.gain.exponentialRampToValueAtTime(.001, t+.3);
        o.start(t); o.stop(t+.35);
      });
    } else {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 200; o.type = 'sawtooth';
      g.gain.setValueAtTime(.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.4);
      o.start(ctx.currentTime); o.stop(ctx.currentTime+.4);
    }
  } catch(e){}
}

function lancarConfete() {
  const cores = ['#25D366','#128C7E','#F1C40F','#3498DB','#9B59B6','#FF6B35'];
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'conf';
    el.style.cssText = `
      left:${Math.random()*100}vw; top:-20px;
      background:${cores[Math.floor(Math.random()*cores.length)]};
      transform:rotate(${Math.random()*360}deg);
      animation:cadeConf ${1.2+Math.random()*1.5}s ease forwards;
      animation-delay:${Math.random()*.4}s;
    `;
    document.body.appendChild(el);
  }
  const s = document.createElement('style');
  s.textContent = `@keyframes cadeConf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(80vh) rotate(720deg)}}`;
  document.head.appendChild(s);
  setTimeout(() => document.querySelectorAll('.conf').forEach(e=>e.remove()), 3000);
}

function mostrarFeedbackFloat(msg, cor) {
  const fb = document.getElementById('feedbackFloat');
  fb.textContent = msg;
  fb.style.background = cor;
  fb.style.boxShadow = `0 4px 30px ${cor}55`;
  fb.classList.add('show');
  setTimeout(() => fb.classList.remove('show'), 2300);
}

// Iniciar
iniciarJogo();

</script>

<script>
  function abrirJogo(id) {
    // Esconder todos
    document.querySelectorAll('.game-panel').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    // Mostrar selecionado
    document.getElementById('panel-' + id).style.display = 'block';
    document.getElementById('tab-' + id).classList.add('active');
  }
</script>
</body>
</html>
